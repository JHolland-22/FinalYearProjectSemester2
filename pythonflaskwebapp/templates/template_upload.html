{% extends "layout.html" %}

{% block content %}
<div class="content-section">
    <h2 class="border-bottom mb-4">
        {% if edit_mode %}Edit Template{% else %}Create New Template{% endif %}
    </h2>
    <form method="POST" action="">
        <div class="form-group">
            <label for="template_name">Template Name</label>
            <input type="text" id="template_name" name="template_name" class="form-control"
                   value="{{ form_data.template_name if form_data else '' }}" required>
        </div>
        <div class="form-group mt-3">
            <label for="share_with">Share With Class Group</label>
            <select name="share_with" id="share_with" class="form-control" required>
                <option value="">Select Class Group</option>
                <option value="devops">DevOps</option>
                <option value="cloud computing">Cloud Computing</option>
                <option value="network security">Network Security</option>
                <option value="All">All Classes (Public)</option>
            </select>
        </div>
        <div class="form-group mt-3">
            <label for="ami_id">AMI ID</label>
            <input type="text" id="ami_id" name="ami_id" class="form-control"
                   value="{{ form_data.ami_id if form_data else '' }}"
                   placeholder="ami-xxxxxxxxxxxxxxxxx" required>
        </div>
        <div class="form-group mt-3">
            <label for="instance_type">Instance Type</label>
            <select id="instance_type" name="instance_type" class="form-control">
                <option value="t2.medium">t2.medium (4GB RAM)</option>
                <option value="t2.large">t2.large (8GB RAM)</option>
                <option value="t2.xlarge">t2.xlarge (16GB RAM)</option>
            </select>
        </div>
        <div class="form-group mt-3">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="form-group mt-3">
            <label for="user_data">User Data Script (Optional)</label>
            <textarea id="user_data" name="user_data" class="form-control" rows="8">
            </textarea>
        </div>
        <div class="form-group mt-3">
            <button type="submit" class="btn btn-outline-info">
                {% if edit_mode %}Update Template{% else %}Create Template{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
