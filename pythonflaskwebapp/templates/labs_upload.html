{% extends "layout.html" %}

{% block content %}
<div class="content-section">
    <h2 class="border-bottom mb-4">Upload New Lab</h2>
    <form method="POST" action="#" enctype="multipart/form-data">
        <div class="form-group">
            <label for="lab_file">Upload Lab PDF</label>
            <input type="file" id="lab_file" name="lab_file" class="form-control-file">
        </div>
        <div class="form-group mt-3">
            <label for="category_select">Select Category</label>
            <select id="category_select" name="category_select" class="form-control">
                {% for category in categories %}
                    <option value="{{ category }}">{{ category }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group mt-3">
            <button type="submit" class="btn btn-outline-info">Upload Lab</button>
        </div>
    </form>
</div>
{% endblock %}
