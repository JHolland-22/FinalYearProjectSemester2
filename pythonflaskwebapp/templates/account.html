{% extends "layout.html" %}
{% block content %}
<div class="content-section">
  <h2 class="account-heading">{{ session.get('role', 'User') }}</h2>
  <p class="text-secondary">{{ session.get('email', '') }}</p>

  <!-- AWS Credentials -->
  <div class="mt-4">
      <h3>AWS Credentials</h3>
      <form method="POST" action="{{ url_for('update_aws_credentials') }}">
          <div class="form-group">
              <label class="form-control-label" for="aws_access_key_id">Access Key ID</label>
              <input class="form-control" id="aws_access_key_id" name="aws_access_key_id" type="text">
          </div>
          <div class="form-group">
              <label class="form-control-label" for="aws_secret_access_key">Secret Access Key</label>
              <input class="form-control" id="aws_secret_access_key" name="aws_secret_access_key" type="password">
          </div>
          <div class="form-group">
              <label class="form-control-label" for="aws_session_token">Session Token</label>
              <textarea class="form-control" id="aws_session_token" name="aws_session_token" rows="3"></textarea>
          </div>
          <button class="btn btn-success" type="submit">Update Credentials</button>
      </form>
  </div>
</div>
{% endblock content %}
